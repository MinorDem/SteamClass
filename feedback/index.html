<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Board</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-dim: #1d4ed8;
    --text: #111827;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --danger: #c0392b;
    --mono: 'IBM Plex Mono', monospace;
    --serif: 'Playfair Display', serif;
    --sans: 'IBM Plex Sans', sans-serif;
    --radius: 2px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 28px 0 22px;
    text-align: center;
    position: relative;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 80% at 50% -20%, #2563eb12 0%, transparent 70%);
    pointer-events: none;
  }
  header h1 {
    font-family: var(--serif);
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing: 0.02em;
    color: var(--text);
  }
  header h1 span { color: var(--accent); }
  header p {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── Layout ── */
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ── Compose Panel ── */
  .compose {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 36px;
    position: relative;
    overflow: hidden;
  }
  .compose::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.4;
  }
  .compose-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }

  /* quote preview inside compose */
  .quote-preview {
    display: none;
    background: var(--bg);
    border-left: 3px solid var(--accent-dim);
    padding: 10px 14px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    position: relative;
  }
  .quote-preview.visible { display: block; }
  .quote-preview .q-author {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .quote-preview .q-text {
    font-size: 13px;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 60px;
    overflow: hidden;
  }
  .quote-preview .q-clear {
    position: absolute;
    top: 8px; right: 10px;
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    transition: color .15s;
  }
  .quote-preview .q-clear:hover { color: var(--danger); }

  /* fields */
  .fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 480px) { .fields { grid-template-columns: 1fr; } }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 5px;
  }
  label span { color: var(--danger); margin-left: 2px; }

  input, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    resize: none;
  }
  input:focus, textarea:focus {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px #c9a84c12;
  }
  input::placeholder, textarea::placeholder { color: var(--text-faint); }

  .char-wrap { position: relative; }
  .char-count {
    position: absolute;
    bottom: 10px; right: 12px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    pointer-events: none;
  }
  .char-count.near { color: var(--accent-dim); }
  .char-count.over { color: var(--danger); }

  textarea { min-height: 110px; padding-bottom: 28px; }

  .field-full { grid-column: 1 / -1; }

  .submit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    gap: 12px;
  }
  .status {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    min-height: 16px;
    transition: color .2s;
  }
  .status.ok { color: #6dbf8a; }
  .status.err { color: var(--danger); }

  button.post-btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: var(--accent);
    color: #0f0e0c;
    border: none;
    border-radius: var(--radius);
    padding: 9px 22px;
    cursor: pointer;
    font-weight: 500;
    transition: opacity .15s, transform .1s;
    flex-shrink: 0;
  }
  button.post-btn:hover { opacity: 0.88; }
  button.post-btn:active { transform: scale(0.97); }
  button.post-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Feed ── */
  .feed-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .feed-header h2 {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 400;
    color: var(--text-muted);
  }
  .feed-header .count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }

  .feed { display: flex; flex-direction: column; gap: 14px; }

  /* single card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    position: relative;
    animation: fadeUp .3s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-meta {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .card-author {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  .card-title {
    font-family: var(--serif);
    font-size: 1rem;
    color: var(--text);
    flex: 1;
  }
  .card-time {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    margin-left: auto;
  }

  /* quote inside card */
  .card-quote {
    background: #f8fafc;
    border-left: 3px solid #d1d5db;
    padding: 8px 12px;
    border-radius: var(--radius);
    margin-bottom: 12px;
  }
  .card-quote .cq-author {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    margin-bottom: 3px;
  }
  .card-quote .cq-text {
    font-size: 13px;
    color: var(--text-muted);
    word-break: break-word;
  }

  .card-content {
    color: var(--text);
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .card-actions {
    margin-top: 14px;
    display: flex;
    gap: 8px;
  }
  .action-btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-faint);
    padding: 5px 12px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .action-btn:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  /* empty state */
  .empty {
    text-align: center;
    padding: 60px 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
  }
  .empty::before { content: '[ '; }
  .empty::after  { content: ' ]'; }

  /* loading skeleton */
  .skeleton {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
  }
  .skel-line {
    height: 12px;
    background: var(--surface2);
    border-radius: 2px;
    margin-bottom: 10px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .5; }
    50%       { opacity: 1; }
  }
  .skel-line:nth-child(1) { width: 35%; }
  .skel-line:nth-child(2) { width: 80%; }
  .skel-line:nth-child(3) { width: 65%; animation-delay: .1s; }
  
  .back-header{
  position:fixed;
  top:16px;
  left:16px;
  z-index:9999;
  background:transparent;
  border:none;
  padding:0;
  backdrop-filter:none;
}

.back-link{
  display:flex;
  align-items:center;
  gap:8px;

  background:rgba(255,255,255,.92);
  border:1px solid var(--border);

  padding:10px 16px;
  border-radius:999px;

  color:var(--text);
  text-decoration:none;

  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:600;

  box-shadow:
    0 8px 24px rgba(0,0,0,.08),
    0 2px 6px rgba(0,0,0,.04);

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    border-color .15s ease,
    background .15s ease;
}

.back-link:hover{
  transform:translateY(-1px);

  background:white;

  border-color:var(--accent);

  color:var(--accent);

  box-shadow:
    0 12px 28px rgba(0,0,0,.12),
    0 4px 10px rgba(0,0,0,.06);
}

.back-link:active{
  transform:scale(.97);
}

@media (max-width: 600px){
  .back-header{
    top:10px;
    left:10px;
  }

  .back-link{
    padding:8px 12px;
    font-size:10px;
  }
}
  </style>
</head>
<body>

<header class="back-header"><a class="back-link" href="/puzzle">← Back to Puzzle Home</a></header>

<header>
  <h1>Feed<span>back</span></h1>
  <p>Leave a message · Quote a post · Start a thread</p>
</header>

<div class="container">

  <!-- Compose -->
  <div class="compose">
    <div class="compose-title">New Post</div>

    <!-- quote preview -->
    <div class="quote-preview" id="quotePreview">
      <div class="q-author" id="qpAuthor"></div>
      <div class="q-text" id="qpText"></div>
      <button class="q-clear" id="qpClear" title="Remove quote">×</button>
    </div>

    <div class="fields">
      <div>
        <label for="fAuthor">Handle <span>*</span></label>
        <input type="text" id="fAuthor" placeholder="anon" maxlength="24">
      </div>
      <div>
        <label for="fTitle">Title</label>
        <input type="text" id="fTitle" placeholder="optional" maxlength="60">
      </div>
      <div class="field-full">
        <label for="fContent">Message <span>*</span></label>
        <div class="char-wrap">
          <textarea id="fContent" placeholder="Say something…" maxlength="500"></textarea>
          <span class="char-count" id="charCount">0 / 500</span>
        </div>
      </div>
    </div>

    <div class="submit-row">
      <span class="status" id="status"></span>
      <button class="post-btn" id="postBtn">Post</button>
    </div>
  </div>

  <!-- Feed -->
  <div class="feed-header">
    <h2>Recent posts</h2>
    <span class="count" id="feedCount"></span>
  </div>
  <div class="feed" id="feed">
    <div class="skeleton">
      <div class="skel-line"></div>
      <div class="skel-line"></div>
      <div class="skel-line"></div>
    </div>
  </div>

</div>

<script>
const API = '/api/feedback';

/* ── state ── */
let quoting = null; // { id, author, content }
let posts   = [];

/* ── DOM refs ── */
const feed        = document.getElementById('feed');
const feedCount   = document.getElementById('feedCount');
const fAuthor     = document.getElementById('fAuthor');
const fTitle      = document.getElementById('fTitle');
const fContent    = document.getElementById('fContent');
const postBtn     = document.getElementById('postBtn');
const status      = document.getElementById('status');
const charCount   = document.getElementById('charCount');
const quotePreview= document.getElementById('quotePreview');
const qpAuthor    = document.getElementById('qpAuthor');
const qpText      = document.getElementById('qpText');
const qpClear     = document.getElementById('qpClear');

/* ── char counter ── */
fContent.addEventListener('input', () => {
  const n = fContent.value.length;
  charCount.textContent = `${n} / 500`;
  charCount.className = 'char-count' + (n >= 480 ? ' over' : n >= 400 ? ' near' : '');
});

/* ── quote controls ── */
qpClear.addEventListener('click', clearQuote);
function setQuote(post) {
  quoting = post;
  qpAuthor.textContent = post.author;
  qpText.textContent = post.content.slice(0, 200) + (post.content.length > 200 ? '…' : '');
  quotePreview.classList.add('visible');
  fContent.focus();
}
function clearQuote() {
  quoting = null;
  quotePreview.classList.remove('visible');
}

/* ── fetch feed ── */
async function loadFeed() {
  try {
    const res = await fetch(API);
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      console.error('GET ' + API + ' returned non-JSON:', text.slice(0, 300));
      feed.innerHTML = '<div class="empty">endpoint not ready — make sure GET ' + API + ' exists on your server</div>';
      return;
    }
    if (!res.ok) throw new Error(data?.error || res.statusText);
    posts = Array.isArray(data) ? data : (Array.isArray(data?.rows) ? data.rows : []);
    renderFeed();
  } catch (e) {
    feed.innerHTML = '<div class="empty"></div>';
    feed.firstChild.textContent = `could not load posts — ${e.message}`;
  }
}

function renderFeed() {
  feedCount.textContent = posts.length ? `${posts.length} post${posts.length !== 1 ? 's' : ''}` : '';
  if (!posts.length) {
    feed.innerHTML = '<div class="empty">no posts yet — be the first</div>';
    return;
  }
  feed.innerHTML = '';
  [...posts].reverse().forEach(p => feed.appendChild(buildCard(p)));
}

function buildCard(p) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = p.id;

  const ts = p.created_at ? fmtTime(p.created_at) : '';

  card.innerHTML = `
    <div class="card-meta">
      <span class="card-author">${esc(p.author)}</span>
      ${p.title ? `<span class="card-title">${esc(p.title)}</span>` : ''}
      <span class="card-time">${ts}</span>
    </div>
    ${p.quoted_author ? `
      <div class="card-quote">
        <div class="cq-author">↳ ${esc(p.quoted_author)}</div>
        <div class="cq-text">${esc(p.quoted_content || '')}</div>
      </div>` : ''}
    <div class="card-content">${esc(p.content)}</div>
    <div class="card-actions">
      <button class="action-btn" data-action="quote">Quote</button>
      <button class="action-btn" data-action="reply">Reply</button>
    </div>`;

  card.querySelector('[data-action="quote"]').addEventListener('click', () => setQuote(p));
  card.querySelector('[data-action="reply"]').addEventListener('click', () => {
    setQuote(p);
    fContent.value = `@${p.author} `;
    fContent.dispatchEvent(new Event('input'));
  });

  return card;
}

/* ── submit ── */
postBtn.addEventListener('click', submit);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submit();
});

async function submit() {
  setStatus('');
  const author  = fAuthor.value.trim();
  const content = fContent.value.trim();
  if (!author)  { setStatus('Handle is required.', true); fAuthor.focus(); return; }
  if (!content) { setStatus('Message is required.', true); fContent.focus(); return; }

  postBtn.disabled = true;
  setStatus('Posting…');

  const body = {
    author,
    title:          fTitle.value.trim() || undefined,
    content,
    quoted_id:      quoting?.id      || undefined,
    quoted_author:  quoting?.author  || undefined,
    quoted_content: quoting?.content || undefined,
  };

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error || res.statusText);

    /* optimistic prepend */
    const newPost = {
      id: data.id,
      author, content,
      title: body.title || null,
      quoted_id: body.quoted_id || null,
      quoted_author: body.quoted_author || null,
      quoted_content: body.quoted_content || null,
      created_at: new Date().toISOString(),
    };
    posts.push(newPost);
    feed.insertBefore(buildCard(newPost), feed.firstChild);
    feedCount.textContent = `${posts.length} post${posts.length !== 1 ? 's' : ''}`;

    // clear
    fContent.value = '';
    fTitle.value = '';
    fContent.dispatchEvent(new Event('input'));
    clearQuote();
    setStatus('Posted ✓', false, true);

    // remove empty state if present
    feed.querySelectorAll('.empty, .skeleton').forEach(el => el.remove());

  } catch (e) {
    setStatus(e.message, true);
  } finally {
    postBtn.disabled = false;
  }
}

/* ── helpers ── */
function setStatus(msg, err = false, ok = false) {
  status.textContent = msg;
  status.className = 'status' + (err ? ' err' : ok ? ' ok' : '');
  if (ok) setTimeout(() => { status.textContent = ''; status.className = 'status'; }, 3000);
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const now = Date.now();
  const diff = now - d.getTime();
  if (diff < 60000)  return 'just now';
  if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

/* ── init ── */
loadFeed();
</script>

    position: fixed;
    bottom: 0;

    color: #555;
