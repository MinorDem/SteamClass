<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hit the Target (Difficulty + Name + Win)</title>
  <style>
    body{
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:#ffffff;
      margin:0;
      padding:16px;
      color:#111827;
    }
    .container{
      max-width: 980px;
      margin: 0 auto;
    }
    h1{ margin: 8px 0 6px; }

    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      padding: 8px 0 4px;
    }
    .controls input[type="text"]{
      padding:6px 8px;
      font-size:14px;
      border:1px solid #d1d5db;
      border-radius:6px;
      outline:none;
      width: 220px;
    }
    .controls button{
      padding:6px 12px;
      font-size:14px;
      border-radius:6px;
      border:1px solid #2563eb;
      background:#2563eb;
      color:#fff;
      cursor:pointer;
    }
    .controls button.secondary{
      background:#fff;
      color:#2563eb;
    }

    .difficulty{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      padding: 6px 0;
    }
    .difficulty label{
      display:flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border:1px solid #d1d5db;
      border-radius:6px;
      cursor:pointer;
      user-select:none;
    }

    .stats{
      margin-left:auto;
      font-weight:600;
      white-space:nowrap;
    }

    .game-area{
      position:relative;
      width:100%;
      height:62vh;
      min-height:340px;
      border:2px dashed #e5e7eb;
      border-radius:10px;
      overflow:hidden;
      cursor:crosshair;
      margin-top: 8px;
    }

    .target{
      position:absolute;
      border-radius:50%;
      display:none;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:800;
      user-select:none;
      box-shadow:0 6px 14px rgba(0,0,0,.2);
      background: radial-gradient(circle at 30% 30%, #ffb703, #fb8500);
    }

    .message{
      margin-top:10px;
      min-height:22px;
      font-weight:700;
    }
    .sub{
      margin-top: 4px;
      color:#374151;
      font-size:14px;
      min-height:18px;
    }

    .win-badge{
      display:inline-block;
      padding: 4px 10px;
      border: 1px solid #10b981;
      border-radius: 999px;
      color:#065f46;
      background:#ecfdf5;
      font-weight:800;
      margin-left: 6px;
    }
    /* Back link (top-left) */
    .back-header{
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
    }
    .back-link{
      text-decoration:none;
      color:#000000;
      font-weight:700;
      font-size:16px;
    }
  </style>
</head>
<body>
   <header class="back-header">
    <a class="back-link" href="/puzzle">← Back to Puzzle Home</a>
  </header>
  
  <div class="container">
    <h1>Hit the Target</h1>

    <div class="controls">
      <input id="nameInput" type="text" placeholder="Student name" />
      <button id="startBtn">Start</button>
      <button id="resetBtn" class="secondary">Reset</button>

      <div class="stats">
        Time: <span id="timeLeft">30</span>s ·
        Score: <span id="score">0</span> ·
        Goal: <span id="goal">12</span>
      </div>
    </div>

    <div class="difficulty" role="radiogroup" aria-label="Difficulty">
      <strong>Difficulty:</strong>
      <label>
        <input type="radio" name="difficulty" value="easy" checked />
        Easy
      </label>
      <label>
        <input type="radio" name="difficulty" value="medium" />
        Medium
      </label>
      <label>
        <input type="radio" name="difficulty" value="hard" />
        Hard
      </label>
    </div>

    <div class="game-area" id="gameArea">
      <div class="target" id="target">+</div>
    </div>

    <div class="message" id="message"></div>
    <div class="sub" id="sub"></div>
  </div>
