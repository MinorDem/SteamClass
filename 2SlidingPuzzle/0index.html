<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Number Puzzle Game (3x3 / 4x4 / 5x5)</title>

<style>
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 24px;
  }
  .card {
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 16px;
    max-width: 820px;
    margin: 0 auto; /* centers the content block (card) */
  }
  .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  #boardWrap { margin-top: 16px; display: inline-block; text-align: center; }
  #board {
    display: grid;
    gap: 10px;
    user-select: none;
    margin: 0 auto; /* centers the grid itself */
  }
  .tile {
    position: relative;
    display: flex;              /* centers number inside tile */
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 1px solid #cfcfcf;
    font-weight: 800;
    font-size: 22px;
    cursor: pointer;
    background: #f7f7f7;
  }
  .empty {
    background: transparent;
    border: 1px dashed #d7d7d7;
    cursor: default;
  }
  .meta {
    position: absolute;
    bottom: 6px;
    left: 8px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(0,0,0,.55);
    display: none;
  }
  .debug-on .meta { display: block; }
  button, select, input {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-weight: 600;
  }
  .status { margin-top: 10px; font-size: 14px; }
  .win { color: #0a7a2f; font-weight: 900; }

  /* Back link (top-left) */
    .back-header{
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
    }
    .back-link{
      text-decoration:none;
      color:#000000;
      font-weight:700;
      font-size:16px;
    }
</style>
</head>

<body>
<header class="back-header">
  <a class="back-link" href="/puzzle">← Back to Puzzle Home</a>
</header>

<div class="card" id="app">

  <div class="row">
    <label><strong>Name:</strong></label>
    <input id="studentName" placeholder="Enter your name" />

    <label><strong>Board:</strong></label>
    <select id="size">
      <option value="3">3 × 3</option>
      <option value="4">4 × 4</option>
      <option value="5">5 × 5</option>
      <option value="6">6 × 6</option>
      <option value="7">7 × 7</option>
      <option value="8">8 × 8</option>
    </select>

    <label><strong>Level:</strong></label>
    <select id="level">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>

    <button id="shuffleBtn">Shuffle</button>

    <label>
      <input type="checkbox" id="debugToggle" />
      Debug
    </label>
  </div>

  <div id="boardWrap">
    <div id="board"></div>
  </div>

  <div class="status">
    Player: <strong><span id="playerDisplay"></span></strong> |
    Moves: <span id="moves">0</span> |
    Time: <span id="time">0</span>s
    <span id="winMsg"></span>
  </div>

</div>

<script>
/* ---------- DOM ---------- */
const app = document.getElementById("app");
const boardEl = document.getElementById("board");
const sizeEl = document.getElementById("size");
const levelEl = document.getElementById("level");
const movesEl = document.getElementById("moves");
const timeEl = document.getElementById("time");
const winMsgEl = document.getElementById("winMsg");
const shuffleBtn = document.getElementById("shuffleBtn");
const debugToggle = document.getElementById("debugToggle");
const nameInput = document.getElementById("studentName");
const playerDisplay = document.getElementById("playerDisplay");

/* ---------- State ---------- */
let N = 3;
let tiles = [];
let moves = 0;
let seconds = 0;
let timer = null;
let started = false;

/* ---------- Utilities ---------- */
const idxToRC = i => ({ r: Math.floor(i / N), c: i % N });
const rcToIdx = (r, c) => r * N + c;

function solvedTiles() {
  const a = [];
  for (let i = 1; i <= N * N - 1; i++) a.push(i);
  a.push(0);
  return a;
}

function isAdjacent(a, b) {
  const A = idxToRC(a), B = idxToRC(b);
  return Math.abs(A.r - B.r) + Math.abs(A.c - B.c) === 1;
}

function isSolved() {
  return tiles.every((v, i) => v === (i === tiles.length - 1 ? 0 : i + 1));
}

/* ---------- Timer ---------- */
function startTimer() {
  if (timer) return;
  timer = setInterval(() => {
    seconds++;
    timeEl.textContent = seconds;
  }, 1000);
}

function stopTimer() {
  if (timer) {
    clearInterval(timer);
    timer = null;
  }
}

function resetStats() {
  moves = 0;
  seconds = 0;
  started = false;
  stopTimer();
  updateStatus();
}

/* ---------- Render ---------- */
function setGridSize() {
  // Auto-scale tiles so 6x6–8x8 fit better
  const sizeMap = { 3: 90, 4: 76, 5: 62, 6: 52, 7: 46, 8: 40 };
  const size = sizeMap[N] || 62;

  boardEl.style.gridTemplateColumns = `repeat(${N}, ${size}px)`;
  boardEl.style.gridTemplateRows = `repeat(${N}, ${size}px)`;

  // Keep text readable on larger boards
  const fontMap = { 3: 22, 4: 22, 5: 22, 6: 20, 7: 18, 8: 16 };
  const fontSize = fontMap[N] || 22;

  // Apply font size to tiles via CSS variable-like approach (inline)
  // We keep your stylesheet intact; only adjust tile font-size here.
  document.documentElement.style.setProperty("--tile-font-size", fontSize + "px");
}

// Override tile font size using the CSS variable set above
// (This does not change your original style rules; it just updates the value.)
const styleEl = document.createElement("style");
styleEl.textContent = `.tile{ font-size: var(--tile-font-size, 22px); }`;
document.head.appendChild(styleEl);

function render() {
  setGridSize();
  boardEl.innerHTML = "";

  tiles.forEach((v, i) => {
    const { r, c } = idxToRC(i);
    const tile = document.createElement("div");
    tile.className = "tile" + (v === 0 ? " empty" : "");
    tile.innerHTML = `
      <div>${v === 0 ? "" : v}</div>
      <div class="meta">(${r},${c}) i:${i}</div>
    `;
    if (v !== 0) tile.onclick = () => move(i);
    boardEl.appendChild(tile);
  });

  updateStatus();
}

/* ---------- Game Logic ---------- */
function move(i) {
  const empty = tiles.indexOf(0);
  if (!isAdjacent(i, empty)) return;

  if (!started) {
    started = true;
    startTimer();
  }

  [tiles[i], tiles[empty]] = [tiles[empty], tiles[i]];
  moves++;
  render();
}

function shuffle() {
  tiles = solvedTiles();
  resetStats();

  // Increase base shuffle steps for larger boards
  const baseMap = { 3: 60, 4: 140, 5: 220, 6: 320, 7: 420, 8: 520 };
  const base = baseMap[N] || 220;

  const factor = levelEl.value === "easy" ? 0.8 :
                 levelEl.value === "hard" ? 1.7 : 1;
  let steps = Math.floor(base * factor);

  let empty = tiles.indexOf(0), prev = -1;
  while (steps--) {
    const { r, c } = idxToRC(empty);
    const n = [];
    if (r > 0) n.push(rcToIdx(r - 1, c));
    if (r < N - 1) n.push(rcToIdx(r + 1, c));
    if (c > 0) n.push(rcToIdx(r, c - 1));
    if (c < N - 1) n.push(rcToIdx(r, c + 1));

    const opts = n.filter(x => x !== prev);
    const pool = opts.length ? opts : n;
    const pick = pool[Math.floor(Math.random() * pool.length)];

    prev = empty;
    [tiles[pick], tiles[empty]] = [tiles[empty], tiles[pick]];
    empty = pick;
  }
  render();
}

/* ---------- Status ---------- */
function updateStatus() {
  movesEl.textContent = moves;
  timeEl.textContent = seconds;

  if (isSolved() && started) {
    stopTimer(); // stops timer immediately when solved
    const name = nameInput.value.trim();
    winMsgEl.innerHTML =
      ` | <span class="win">${name ? name + ", " : ""}You solved it!</span>`;
  } else {
    winMsgEl.textContent = "";
  }
}

/* ---------- Name Handling ---------- */
function loadName() {
  const saved = localStorage.getItem("studentName") || "";
  nameInput.value = saved;
  playerDisplay.textContent = saved;
}
nameInput.addEventListener("input", () => {
  const name = nameInput.value;
  playerDisplay.textContent = name;
  localStorage.setItem("studentName", name);
});

/* ---------- UI ---------- */
sizeEl.onchange = () => {
  N = Number(sizeEl.value);
  shuffle(); // always shuffle first when size changes
};

levelEl.onchange = () => {
  shuffle(); // reshuffle when difficulty changes
};

shuffleBtn.onclick = shuffle;

debugToggle.onchange = e => app.classList.toggle("debug-on", e.target.checked);

/* ---------- Init ---------- */
loadName();
shuffle(); // ✅ always start shuffled
</script>

          bottom: 0;

</body>
</html>
