  <style>
    :root {
      --bg: #07071a;
      --panel: #0e0e28;
      --border: #1c1c45;
      --gold: #ffd700;
      --silver: #b0b8d0;
      --bronze: #cd8040;
      --accent: #00e5ff;
      --pink: #ff3d7f;
      --green: #00ff9d;
      --purple: #b060ff;
      --text: #d0d4f0;
      --dim: #464680;
      --head-bg: #0b0b22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      padding: 24px 16px 48px;
      min-height: 100vh;
    }
    /* scanline overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 999;
    }
    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(13px, 2.5vw, 22px);
      text-align: center;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 6px rgba(255,215,0,0.3);
      margin-bottom: 6px;
      letter-spacing: 3px;
    }
    .subtitle {
      text-align: center;
      color: var(--dim);
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* table container */
    .scroll-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(0,229,255,0.06);
    }

    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-size: 13px;
    }

    /* HEADER ROWS */
    thead tr.group-row th {
      background: #060618;
      color: var(--purple);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 4px 4px;
      border: 1px solid var(--border);
    }
    thead tr.col-row th {
      background: var(--head-bg);
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 1px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    /* sticky rank + name */
    th.sticky, td.sticky {
      position: sticky;
      background: var(--panel);
      z-index: 3;
    }
    th.s0, td.s0 { left: 0; min-width: 42px; }
    th.s1, td.s1 { left: 42px; min-width: 130px; text-align: left; }
    thead th.sticky { background: var(--head-bg); z-index: 4; }

    /* body cells */
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:nth-child(even) { background: rgba(255,255,255,0.015); }
    tbody tr:hover td { background: rgba(0,229,255,0.06) !important; }

    td {
      padding: 7px 10px;
      text-align: center;
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }
    td.sticky { border-right: 2px solid var(--border); }

    /* rank */
    .rank { font-family: 'Press Start 2P', monospace; font-size: 9px; }
    .r1 { color: var(--gold); }
    .r2 { color: var(--silver); }
    .r3 { color: var(--bronze); }
    .r-else { color: var(--dim); }

    /* player name */
    .pname { font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }

    /* total wins */
    .total { color: var(--pink); font-weight: 700; font-size: 15px; }

    /* win count cells */
    .w0 { color: #1a1a44; font-size: 11px; }
    .w-lo { color: var(--dim); }
    .w-md { color: var(--accent); font-weight: 600; }
    .w-hi { color: var(--green); font-weight: 700; }
    .w-top { color: var(--gold); font-weight: 700; font-size: 15px; text-shadow: 0 0 8px rgba(255,215,0,0.5); }

    .legend {
      margin-top: 18px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 1px;
    }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  </style>
</head>

/* ─── NAME NORMALIZATION ──────────────────────────────────────────────── */
function normKey(n) {
  const s = n.trim().toLowerCase();
  if (s.startsWith('http')) return null;
  if (s.length > 28) return null;
  if (junk.has(s)) return null;
  // merge typos / variants
  const map = {
    'laosh':'laoshi','derek tsan':'derek tsang','derek tsang4':'derek tsang',
    'joel':'Joel','joel ':'Joel','joelr':'Joel','joel!':'Joel',

    'patrick':'patrick','messi':'messi','connor':'connor',
    'yuji':'yuji','cynthia':'Cynthia','ivette':'ivette',
    'xyl':'xyl','derek':'derek',
  };
  return map[s] || n.trim();
}

  const parts = game.split('_');
  const suffix = parts[parts.length - 1];
  return diffLabel[suffix] || suffix.toUpperCase().slice(0,3);
}

  if (!key) return;
  const dispKey = key.toLowerCase();
  if (!players[dispKey]) players[dispKey] = { display: key, games: {} };
  players[dispKey].games[game] = (players[dispKey].games[game] || 0) + wins;
});

// compute totals

  const total = allGames.reduce((s, g) => s + (p.games[g] || 0), 0);
  return { ...p, total };
}).filter(p => p.total > 0)
  .sort((a, b) => b.total - a.total);

  const rankTd = document.createElement('td');
  rankTd.className = 'sticky s0 rank';
  const medal = ['🥇','🥈','🥉'][idx] || `#${idx+1}`;
  const cls = idx===0?'r1':idx===1?'r2':idx===2?'r3':'r-else';
  rankTd.innerHTML = `<span class="${cls}">${medal}</span>`;
  tr.appendChild(rankTd);

  // name
  const nameTd = document.createElement('td');
  nameTd.className = 'sticky s1 pname';
  nameTd.textContent = row.display;
  tr.appendChild(nameTd);

  // total
  const totTd = document.createElement('td');
  totTd.className = 'total';
  totTd.textContent = row.total;
  tr.appendChild(totTd);

  // games
  allGames.forEach(g => {
    const w = row.games[g] || 0;
    const td = document.createElement('td');
    if (w === 0) {
      td.className = 'w0';
      td.textContent = '—';
    } else {
      const max = gameMax[g] || 1;
      const ratio = w / max;
      let cls;
      if (w >= 50) cls = 'w-top';
      else if (ratio >= 0.5 || w >= 20) cls = 'w-hi';
      else if (w >= 5) cls = 'w-md';
      else cls = 'w-lo';
      td.className = cls;
      td.textContent = w;
    }
    tr.appendChild(td);
  });

  tbody.appendChild(tr);
});
tbl.appendChild(tbody);
</script>
</body>
</html>
