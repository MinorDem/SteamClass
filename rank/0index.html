<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puzzle Rank</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 24px; }
    .wrap { max-width: 820px; margin: 0 auto; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    a.btn { display:inline-block; padding:10px 14px; border:1px solid #ddd; border-radius:12px; text-decoration:none; color:#111; background:#fff; }
    h1 { margin: 14px 0 6px; }
    p { margin: 0 0 16px; opacity:0.85; }
    ol { padding-left: 22px; }
    li { margin: 8px 0; }
    .note { margin-top: 14px; font-size: 14px; opacity: 0.85; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="btn" href="/puzzle">← Back to Puzzle Home</a>
    </div>

    <h1>🏆 Puzzle Rank (Top 10)</h1>
    <p>Game: <strong>Word Guess</strong>. Ranking: Wins (high → low), then Best Time (low → high).</p>

    <ol id="rankList"><li>Loading…</li></ol>
    <div id="status" class="note"></div>
  </div>

  <script>
    const GAME_ID = "wordguess";

    async function loadRank() {
      const list = document.getElementById("rankList");
      const status = document.getElementById("status");
      try {
        const res = await fetch(`/api/leaderboard?game=${encodeURIComponent(GAME_ID)}&limit=10`, { cache: "no-store" });
        const data = await res.json();
        const rows = Array.isArray(data) ? data : (data.rows || []);

        list.innerHTML = "";
        if (!rows.length) {
          list.innerHTML = "<li>No scores yet.</li>";
          status.textContent = "";
          return;
        }

        rows.forEach((r, i) => {
          const name = r.player_name ?? r.playerName ?? "Unknown";
          const wins = r.win_count ?? r.wins ?? r.winCount ?? 0;
          const best = r.best_seconds ?? r.bestSeconds ?? null;

          const li = document.createElement("li");
          li.textContent = `#${i+1} ${name} — Wins: ${wins}` + (best != null ? ` — Best: ${best}s` : "");
          list.appendChild(li);
        });

        status.textContent = "Updated just now.";
      } catch (e) {
        list.innerHTML = "<li class='err'>Could not load leaderboard.</li>";
        status.textContent = "Check that /api/leaderboard is reachable.";
        status.classList.add("err");
      }
    }

    loadRank();
  </script>
</body>
</html>
